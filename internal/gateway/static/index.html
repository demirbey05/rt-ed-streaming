<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Order Stream</title>
  <style>
    :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --card: #fff; --line: #e3e3de; --accent: #2f6f4f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151514; --fg: #ececea; --muted: #9a9a94; --card: #1f1f1d; --line: #33332f; --accent: #6fbf8f; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 16px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    input, button { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); }
    button { cursor: pointer; }
    #status { font-size: 13px; color: var(--muted); }
    #status.live { color: var(--accent); }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    li .meta { font-size: 12px; color: var(--muted); }
    code { font-size: 12px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>Live Order Stream</h1>
  <p>Events flow: order-service → outbox → relay → RabbitMQ → stream-gateway → this page (SSE).</p>
  <form id="f">
    <input id="customer" placeholder="customer_id (empty = all)">
    <button>Connect</button>
    <span id="status">disconnected</span>
  </form>
  <ul id="events"></ul>
</main>
<script>
  let source;
  const list = document.getElementById('events');
  const status = document.getElementById('status');

  function connect(customer) {
    if (source) source.close();
    const url = '/events' + (customer ? '?customer_id=' + encodeURIComponent(customer) : '');
    source = new EventSource(url);
    source.onopen = () => { status.textContent = 'live'; status.className = 'live'; };
    source.onerror = () => { status.textContent = 'reconnecting…'; status.className = ''; };
    source.addEventListener('order.created', (e) => {
      const ev = JSON.parse(e.data);
      const p = ev.payload;
      const li = document.createElement('li');
      li.innerHTML = '<strong></strong><div class="meta"></div><code></code>';
      li.querySelector('strong').textContent =
        `${p.customer_id} ordered ${(p.amount_cents / 100).toFixed(2)} ${p.currency}`;
      li.querySelector('.meta').textContent = `${ev.type} · ${new Date(ev.occurred_at).toLocaleTimeString()}`;
      li.querySelector('code').textContent = `event ${ev.id}`;
      list.prepend(li);
    });
  }

  document.getElementById('f').addEventListener('submit', (e) => {
    e.preventDefault();
    connect(document.getElementById('customer').value.trim());
  });
  connect('');
</script>
</body>
</html>
